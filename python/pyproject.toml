[build-system]
requires = ["flit_core>=3.9,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "signalforge"
version = "0.1.0"
description = "Signal generation, processing and measurement for RF and communications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RelentlessOldMan" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=2.4"]

[project.urls]
Source = "https://github.com/RelentlessOldMan/SignalForge"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
