name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - run: python -m signalforge.conformance
      - name: Generated vectors match their generators
        run: for g in ../vectors/generators/*.py; do python "$g" --check; done

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build SignalForge.slnx
      - run: dotnet test SignalForge.slnx --no-build
      - run: dotnet format SignalForge.slnx --verify-no-changes

  cross:
    # Both languages on one runner: the conformance reports diffed, the link configs compared,
    # and signal files written by each language read by both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: pip install -e python
      - run: dotnet build dotnet/tools/SignalForge.Conformance
      - run: python -m signalforge.conformance --report reports/python.json
      - run: dotnet run --no-build --project dotnet/tools/SignalForge.Conformance -- --report reports/dotnet.json
      - run: python -m signalforge.compare reports reports/python.json reports/dotnet.json
      - name: Link configs in both languages
        run: |
          for cfg in vectors/links/*.json; do
            name=$(basename "$cfg" .json)
            python -m signalforge.compare run-link "$cfg" --out "reports/link-$name-python.json"
            dotnet run --no-build --project dotnet/tools/SignalForge.Conformance -- link "$cfg" --out "reports/link-$name-dotnet.json"
            python -m signalforge.compare link "reports/link-$name-python.json" "reports/link-$name-dotnet.json"
          done
      - name: Signal files exchanged between the languages
        run: |
          python -m signalforge.compare write-files reports/files
          dotnet run --no-build --project dotnet/tools/SignalForge.Conformance -- write-files reports/files
          dotnet run --no-build --project dotnet/tools/SignalForge.Conformance -- read-files reports/files --out reports/files-dotnet.json
          python -m signalforge.compare read-files reports/files --out reports/files-python.json
          python -m signalforge.compare files reports/files-python.json reports/files-dotnet.json
